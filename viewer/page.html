<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <meta name="color-scheme" content="dark">
    <title>Desktop</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="page.css">
    <script type="module" src="page.js"></script>
  </head>
  <body>
    <header class="bar">
      <span class="status" id="status" role="status" aria-live="polite"></span>
      <span class="actions">
        <button type="button" id="keyboard" hidden></button>
        <button type="button" id="toggle" class="primary"></button>
      </span>
    </header>
    <main class="stage" id="stage">
      <canvas id="screen"></canvas>
      <textarea id="input" class="keyboard" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-hidden="true" tabindex="-1"></textarea>
      <p class="message" id="message" hidden></p>
    </main>
  </body>
</html>
